[package]
name = "token-ledger-v2-builder"
version = "0.1.0"
edition = "2024"
description = "Builder for Token Ledger V2: maintains state, computes transitions, submits WorkPackages"
license = "Apache-2.0"

[[bin]]
name = "tl2-builder"
path = "src/main.rs"


[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
codec = { version = "0.1.1", default-features = false, package = "jam-codec" }
colored = "3.1"
futures = "0.3"
hex = "0.4"
jam-std-common = "0.1.26"
jam-null-authorizer-bin = "0.1.26"
jam-tooling = "0.1.26"
jam-types = "0.1.26"
jsonrpsee = { version = "0.24", features = ["http-client", "ws-client"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
blake2 = "0.10"
bytes = "1"
ed25519-consensus = "2.1"
rand = { version = "0.9", features = ["std", "std_rng"] }
jam-token-ledger-v2 = { path = "../token-ledger-v2" }
